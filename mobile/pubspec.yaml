name: medivoice_ai
description: "MediVoice AI - Offline Multilingual Health Assistant"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  cupertino_icons: ^1.0.6

  # --- Speech-to-text (Whisper) ---
  # whisper_ggml wraps whisper.cpp v1.9.1 and runs fully on-device.
  # For this validation step the model is DOWNLOADED on first use and cached.
  # Bundling ggml-tiny.bin as an asset (for true offline) is a later milestone.
  whisper_ggml: ^2.6.0
  record: ^6.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/data/symptom_dictionary.json
    - assets/data/lr_model_weights.json
    - assets/data/advice_templates.json
    - assets/data/doctors.json
    - assets/data/selfcare_guidance.json
    - assets/data/lr_model_weights_25class.json